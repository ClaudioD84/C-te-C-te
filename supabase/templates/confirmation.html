<!-- Modèle « Confirm signup » (Supabase > Authentication > Email Templates). -->
<div style="font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; color: #1b2430; max-width: 480px">
  <h2 style="color: #1a6b60">Côte à Côte</h2>
  <p>Bonjour,</p>
  <p>Merci de votre inscription ! Confirmez votre adresse e-mail pour activer votre compte :</p>
  <p>
    <a
      href="{{ .ConfirmationURL }}"
      style="display: inline-block; background: #1a6b60; color: #ffffff; padding: 12px 24px; border-radius: 24px; text-decoration: none; font-weight: 600"
      >Confirmer mon adresse</a
    >
  </p>
  <p>Revenez ensuite dans l'application pour vous connecter.</p>
  <p style="color: #525b68; font-size: 14px">Vous ne vous êtes pas inscrit ? Ignorez simplement cet e-mail.</p>
</div>
