<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Adresse confirmée · Côte à Côte</title>
    <link rel="icon" href="/favicon.ico" />
    <style>
      :root {
        --bg: #fbf8f3;
        --text: #1b2430;
        --muted: #525b68;
        --primary: #1a6b60;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #14181e;
          --text: #f3f1ec;
          --muted: #b4bac4;
          --primary: #5cc2b2;
        }
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: var(--bg);
        color: var(--text);
        font: 18px/1.5 system-ui, -apple-system, 'Segoe UI', sans-serif;
      }
      main {
        max-width: 420px;
        padding: 24px 16px;
        text-align: center;
      }
      img {
        width: 96px;
        height: 96px;
        border-radius: 22px;
      }
      h1 {
        font-size: 26px;
        color: var(--primary);
        margin: 20px 0 8px;
      }
      p {
        color: var(--muted);
        margin: 8px 0;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icon.png" alt="" />
      <h1>Adresse confirmée ✓</h1>
      <p>Votre compte Côte à Côte est prêt.</p>
      <p>Revenez dans l’application et connectez-vous avec votre adresse e-mail et votre mot de passe.</p>
    </main>
  </body>
</html>
