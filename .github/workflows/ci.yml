name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  app:
    name: Lint, types et tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm format:check
      - run: pnpm test
      - run: pnpm check:functions
      - run: pnpm test:functions
      - run: pnpm test:scripts

  database:
    name: Migrations Supabase
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      # Démarre une base locale et applique toutes les migrations : échoue si une migration est invalide.
      - run: supabase db start

  e2e:
    name: Tests de bout en bout
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Vraie pile Supabase locale (base, authentification, stockage) ; les fonctions tournent avec Deno.
      - run: pnpm exec supabase start -x studio,imgproxy,logflare,vector,supavisor,postgres-meta,edge-runtime,mailpit,realtime
      - run: pnpm --filter e2e exec playwright install --with-deps chromium
      - run: pnpm e2e:build
      - run: pnpm test:e2e
        env:
          CI: true
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rapport-e2e
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 7
